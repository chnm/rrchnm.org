name: "[rrchnm.org] Build, Release, Deploy"

on:
  workflow_dispatch:
  schedule:
    # Off the top of the hour: GitHub delays on-the-hour crons the most
    # (11:38 UTC ≈ 7:38 a.m. EDT nominal; scheduled runs are best-effort).
    - cron: '38 11 * * 1-5'
  push:
    branches:
      - "main"
      - "preview"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      has_new: ${{ steps.scan.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # Non-schedule triggers (push, manual) always build.
          if os.environ.get("EVENT_NAME") != "schedule":
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_new=true\n")
              sys.exit(0)

          now = datetime.now(timezone.utc)

          # A post is "newly publishable" only if its publishDate passed since
          # the previous successful scheduled run — that run already considered
          # everything up to its own start time. Fall back to a 4-day lookback
          # (covers the Fri→Mon gap and dropped best-effort crons) when the
          # API is unreachable or there is no prior run.
          since = now - timedelta(days=4)
          try:
              url = (
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                  "/actions/workflows/cicd.yml/runs?event=schedule&status=success&per_page=1"
              )
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=10) as resp:
                  runs = json.load(resp).get("workflow_runs", [])
              if runs:
                  since = datetime.fromisoformat(
                      runs[0]["run_started_at"].replace("Z", "+00:00")
                  ).astimezone(timezone.utc)
                  print(f"since = last successful scheduled run: {since.isoformat()}")
              else:
                  print(f"no prior successful scheduled run; 4-day fallback: {since.isoformat()}")
          except Exception as exc:
              print(f"run-history lookup failed ({exc}); 4-day fallback: {since.isoformat()}")

          # Hugo's canonical scheduling field. Case-insensitive because Hugo
          # lowercases frontmatter keys internally. No fallback to `date`.
          publish_date_re = re.compile(
              r'^publishDate:\s*["\']?(.+?)["\']?\s*$',
              re.MULTILINE | re.IGNORECASE,
          )

          def parse(value):
              value = value.strip().strip("\"'")
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)
              except ValueError:
                  pass
              try:
                  return datetime.strptime(value, "%Y-%m-%d").replace(tzinfo=timezone.utc)
              except ValueError:
                  return None

          newly_publishable = []
          for root in ("content/blog", "content/publications"):
              for path in Path(root).rglob("*.md"):
                  m = publish_date_re.search(path.read_text(errors="replace"))
                  if not m:
                      continue
                  dt = parse(m.group(1))
                  if dt and since < dt <= now:
                      newly_publishable.append((path, dt))

          for path, dt in newly_publishable:
              print(f"newly publishable: {path} ({dt.isoformat()})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_new={'true' if newly_publishable else 'false'}\n")
          PY

  build-release:
    needs: check
    if: needs.check.outputs.has_new == 'true'
    uses: chnm/.github/.github/workflows/hugo--build-release.yml@main
    secrets: inherit
    with:
      container-registry: "ghcr.io"
      container-image-name: "rrchnm-website"
      hugo-context-root: "."
      hugo-content-path: "/srv"
      hugo-devl-url: "https://hugo.chnm.gmu.edu"
      hugo-prod-url: "https://rrchnm.org"

      build-artifact-name: "rrchnm-website"
      release-tag-name-type: "iso"

      website-devl-fqdn: "hugo.chnm.gmu.edu"
      website-prod-fqdn: "rrchnm.org"

  deploy:
    uses: chnm/.github/.github/workflows/docker--deploy.yml@main
    needs: [build-release]
    secrets: inherit
    with:
      website-devl-fqdn: "hugo.chnm.gmu.edu"
      website-prod-fqdn: "rrchnm.org"
