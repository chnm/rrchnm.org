name: "[rrchnm.org] Build, Release, Deploy"

on:
  workflow_dispatch:
  schedule:
    # Off the top of the hour: GitHub delays on-the-hour crons the most
    # (9:38 UTC ≈ 5:38 a.m. EDT nominal; scheduled runs are best-effort).
    - cron: '38 9 * * 1-5'
  push:
    branches:
      - "main"
      - "preview"

jobs:
  # Skips the rest of the run on cron days when nothing crossed its
  # publishDate/expiryDate. Push and workflow_dispatch always pass.
  pre-flight:
    uses: chnm/.github/.github/workflows/hugo--pre-flight-check.yml@main
    permissions:
      actions: read
      contents: read
    with:
      content-roots: |
        content/blog
        content/publications

  # Build, release, and deploy in one workflow. The release tarball is the
  # deploy payload — the ansible playbook fetches it — so this no longer ships
  # a container to the host the way the previous docker--deploy.yml step did.
  hugo-build-release-deploy:
    needs: pre-flight
    if: needs.pre-flight.outputs.should_build == 'true'
    uses: chnm/.github/.github/workflows/hugo--build-release-deploy.yml@main
    secrets: inherit
    with:

      # Single Hugo site at the repository root, served from Caddy's /srv
      # (not nginx's /usr/share/nginx/html/), so extract from /srv.
      hugo-context-root: "."
      hugo-devl-url: "https://hugo.chnm.gmu.edu"
      hugo-prod-url: "https://rrchnm.org"

      release-tag-name-type: "iso"

      # The release is now load-bearing: the playbook fetches the artifact from
      # it. build-artifact-name and tag-prefix are both intentionally unset, so
      # this repo takes the shared defaults: the asset is hugo-build.tar.gz,
      # tagged "hugo-build-main-<ts>" on main and "hugo-build-devl-<ts>" on
      # every other ref. Releases are repo-scoped and the playbook resolves the
      # repo from the target FQDN, so nothing in the release names this site.

      website-devl-fqdn: "hugo.chnm.gmu.edu"
      website-prod-fqdn: "rrchnm.org"
