baseURL: "https://rrchnm.org/"
title: "Roy Rosenzweig Center for History and New Media"
languageCode: "en-us"

markup:
  goldmark:
    renderer:
      unsafe: true

pagination:
  pagerSize: 12

permalinks:
  posts: "/:slug/"

taxonomies:
  category: categories
  tag: tags

related:
  includeNewer: true
  threshold: 80
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 10
    - name: date
      weight: 5

params:
  description: "Roy Rosenzweig Center for History and New Media at George Mason University"

outputs:
  home:
    - HTML
