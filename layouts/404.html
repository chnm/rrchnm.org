{{ define "main" }}
<div class="max-w-2xl mx-auto text-center py-12 lg:py-20">
  <p class="font-mono text-6xl lg:text-8xl font-bold text-red-brand mb-6">404</p>
  <h1 class="font-serif text-3xl lg:text-4xl text-stone-900 mb-4">Page not found</h1>
  <p class="text-lg text-stone-600 mb-10">The page you're looking for doesn't exist or may have moved. Try searching or visit one of the links below.</p>

  {{/* Inline search */}}
  <div class="mb-12" x-data="{ query: '', results: [], index: null, loaded: false }" x-init="
    fetch('/index.json').then(r => r.json()).then(data => {
      index = data.map(item => ({ ...item, searchableTitle: (item.title || '').toLowerCase(), searchableDesc: (item.desc || '').toLowerCase() }));
      loaded = true;
    })
  ">
    <div class="flex items-center gap-3 max-w-lg mx-auto border border-stone-300 rounded-lg px-4 py-3 focus-within:border-red-brand focus-within:ring-2 focus-within:ring-red-brand/20 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-stone-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
      <input
        type="text"
        x-model="query"
        @input="
          if (!loaded || query.length < 2) { results = []; return; }
          const q = query.toLowerCase().trim();
          results = index.filter(item => item.searchableTitle.includes(q) || item.searchableDesc.includes(q)).slice(0, 6);
        "
        placeholder="Search RRCHNM..."
        class="flex-1 text-base text-stone-900 placeholder-stone-400 bg-transparent border-none outline-none"
        autocomplete="off">
    </div>
    <ul x-show="results.length > 0" class="max-w-lg mx-auto mt-2 bg-white border border-stone-200 rounded-lg shadow-lg overflow-hidden text-left list-none p-0 m-0">
      <template x-for="item in results" :key="item.permalink">
        <li>
          <a :href="item.permalink" class="block px-4 py-3 text-sm hover:bg-stone-50 transition-colors border-b border-stone-100 last:border-b-0 no-underline">
            <span class="font-semibold text-stone-900" x-text="item.title"></span>
            <span class="block text-xs text-stone-500 mt-0.5" x-text="item.section ? item.section.charAt(0).toUpperCase() + item.section.slice(1) : ''"></span>
          </a>
        </li>
      </template>
    </ul>
    <p x-show="query.length >= 2 && results.length === 0 && loaded" class="text-sm text-stone-500 mt-3">No results found. Try a different search term.</p>
  </div>

  {{/* Fallback links */}}
  <div class="flex flex-wrap justify-center gap-4">
    <a href="/" class="inline-block bg-red-brand hover:bg-red-dark text-white text-sm font-semibold px-6 py-3 rounded-md transition-colors">Home</a>
    <a href="/blog/" class="inline-block border border-stone-300 hover:border-stone-400 text-stone-700 text-sm font-semibold px-6 py-3 rounded-md transition-colors">Blog</a>
    <a href="/our-story/" class="inline-block border border-stone-300 hover:border-stone-400 text-stone-700 text-sm font-semibold px-6 py-3 rounded-md transition-colors">Our Story</a>
    <a href="/projects/" class="inline-block border border-stone-300 hover:border-stone-400 text-stone-700 text-sm font-semibold px-6 py-3 rounded-md transition-colors">Our Projects</a>
  </div>
</div>
{{ end }}
