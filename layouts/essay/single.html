{{ define "main" }}
<article class="post-item rrchnm-essay-single">
  <div class="card-inner">
    {{ with .Params.featured_image }}
    <div class="card-media">
      <img src="{{ . }}" alt="{{ $.Title }}">
    </div>
    {{ end }}
    <div class="card-content">
      <div class="card-meta meta-top">
        {{ with .Params.essay_author }}
        <span class="meta-author">{{ . }}</span>
        {{ end }}
        {{ with .Params.essay_date }}
        <span class="meta-date">{{ . }}</span>
        {{ end }}
        {{ with .Params.essay_publication_info }}
        <span class="meta-pub">{{ . }}</span>
        {{ end }}
      </div>
      <div class="card-text">
        {{ .Content }}
      </div>
    </div>
  </div>
</article>
{{ end }}
