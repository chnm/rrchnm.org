{{ define "main" }}
{{ with .Content }}
<div class="prose prose-stone max-w-none mb-12">
  {{ . }}
</div>
{{ end }}

{{ $published := where hugo.Data.people "published" true }}
{{ $sorted := sort $published "last_name" "asc" }}

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
  {{ range $sorted }}{{ partial "staff-card.html" . }}{{ end }}
</div>
{{ end }}
