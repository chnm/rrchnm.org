{{ define "main" }}
<article class="page-content">
  <div class="card-content">
    {{ .Content }}
  </div>
</article>

{{/* Portfolio grid */}}
<div class="project-list grid grid-cols-3">
  <div class="grid-inner clear">
    {{ range (where .Site.RegularPages "Section" "portfolio-item") }}
    {{ $item := . }}
    <article class="grid-item">
      <div class="card-inner">
        <div class="card-media">
          {{ with .Params.featured_image }}
          <a href="{{ $item.RelPermalink }}">
            <img src="{{ . }}" alt="{{ $item.Title }}" loading="lazy">
          </a>
          {{ end }}
        </div>
        <div class="card-content">
          <h5 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h5>
          {{ with .Params.categories }}
          <div class="card-meta">
            {{ range . }}<span class="meta-category">{{ . }}</span>{{ end }}
          </div>
          {{ end }}
        </div>
      </div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
