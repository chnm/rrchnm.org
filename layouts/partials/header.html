<header id="site-header">
  <div id="site-header-inner">
    <a itemprop="url" class="header-logo-link" href="/" rel="home">
      <img class="header-logo" src="/img/logo.png" alt="{{ .Site.Title }}">
    </a>
    <nav class="header-nav" role="navigation" aria-label="Top Menu">
      {{ partial "nav-menu.html" (dict "items" .Site.Data.menus.top_nav.items "depth" 0) }}
    </nav>
  </div>
</header>
