<div class="flex flex-col">
  {{ if .picture }}
  <img src="{{ .picture }}" alt="Photo of {{ .first_name }} {{ .last_name }}" loading="lazy"
    class="w-full aspect-square object-cover rounded-lg bg-stone-100">
  {{ else }}
  <div class="w-full aspect-square rounded-lg bg-stone-100" role="img" aria-label="No photo available for {{ .first_name }} {{ .last_name }}"></div>
  {{ end }}
  <div class="pt-3 text-center">
    <h3 class="text-sm font-semibold text-stone-900">{{ .first_name }} {{ .last_name }}</h3>
    {{ with .job_title }}<p class="text-xs text-stone-500 mt-0.5">{{ . }}</p>{{ end }}
    {{ with .url }}<a href="{{ . }}" class="text-xs text-red-brand hover:text-red-dark transition-colors mt-1 inline-block" target="_blank" rel="noopener">Profile &rarr;</a>{{ end }}
  </div>
</div>
