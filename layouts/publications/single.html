{{ define "main" }}
<article class="max-w-3xl">
  {{/* Meta */}}
  <div class="flex flex-wrap items-center gap-3 mb-8 text-sm">
    {{ with .Params.essay_author }}<span class="text-stone-600 font-medium">{{ . }}</span>{{ end }}
    {{ with .Params.essay_date }}<span class="text-stone-500">{{ . }}</span>{{ end }}
    {{ with .Params.essay_publication_info }}<span class="text-stone-500 italic">{{ . }}</span>{{ end }}
  </div>

  {{ with .Params.featured_image }}
  <div class="mb-8">
    <img src="{{ . }}" alt="{{ $.Title }}" class="w-full rounded-lg">
  </div>
  {{ end }}

  <div class="prose prose-stone max-w-none">
    {{ .Content }}
  </div>
</article>
{{ end }}
