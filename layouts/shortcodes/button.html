{{- $href := .Get "href" | default "#" -}}
{{- $text := .Get "text" | default "Learn More" -}}
{{- $external := .Get "external" | default "true" -}}
<div class="not-prose my-8 text-center">
  <a href="{{ $href }}"{{ if eq $external "true" }} target="_blank" rel="noopener"{{ end }} class="inline-flex items-center gap-2 bg-red-brand hover:bg-red-dark !text-white !no-underline text-sm font-semibold px-8 py-3 rounded-md transition-colors">{{ $text }}{{ if eq $external "true" }}<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>{{ end }}</a>
</div>
