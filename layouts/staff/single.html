{{ define "main" }}
<article class="rrchnm-staff-single">
  <div class="rrchnm-staff-header">
    <div class="rrchnm-two-col rrchnm-col-30-70">
      <div class="rrchnm-col-left">
        {{ with .Params.picture }}
        <img src="{{ . }}" alt="{{ $.Title }}" class="rrchnm-staff-photo">
        {{ end }}
      </div>
      <div class="rrchnm-col-right">
        <h1 class="rrchnm-staff-name">{{ .Title }}</h1>
        {{ with .Params.job_title }}
        <p class="rrchnm-staff-job-title">{{ . }}</p>
        {{ end }}
      </div>
    </div>
  </div>
  <div class="rrchnm-staff-bio">
    {{ .Content }}
  </div>
</article>
{{ end }}
